<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analysis - Pothole Detection</title>
  <link rel="stylesheet" href="styles/global.css">
  <link rel="stylesheet" href="components/Sidebar/sidebar.css">
  <link rel="stylesheet" href="styles/detection_list.css">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

  <!-- Heatmap plugin -->
  <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>
  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>
<body class="analysis-page">
  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <h2>POTHOLE DETECTION</h2>
    <div class="menu">
      <button onclick="location.href='dashboard.html'"><span>Home</span></button>
      <button onclick="location.href='upload.html'"><span>Upload</span></button>
    </div>
  </div>

  <!-- Main -->
  <div class="main">
    <h1 id="page-title"></h1>
    <div class="grid-layout">
      
      <!-- Map + Video Tabs -->
      <div class="map-video box">
        <h2>Map / Video</h2>
        <!-- Tabs -->
        <div class="tabs">
          <button class="tab-button active" data-target="map">Map</button>
          <button class="tab-button" data-target="video">Video</button>
          <label>
            <input type="checkbox" id="toggle-path" checked>
            Show Flight Path
          </label>
          <label>
            <input type="checkbox" id="toggle-startend" checked>
              Show Start/End
            </label>
        </div>

        <!-- Tab content -->
        <div class="tab-content">
          <div id="map-tab" class="tab-panel active">
            <div id="map"></div>
          </div>
          <div id="video-tab" class="tab-panel">
            <video id="analysis-video" controls>
              <source id="video-source" src="" type="video/mp4">
            </video>
          </div>
        </div>
      </div>

      <!-- Detection List -->
      <div class="list box">
        <h2>List of Detection</h2>
        <ul id="detection-list">
          <li>Pothole #1 - GPS (3.139, 101.6869)</li>
          <li>Pothole #2 - GPS (3.145, 101.6900)</li>
        </ul>
      </div>

      <!-- Graph -->
      <div class="graph box">
        <h2>Graph</h2>
        <canvas id="detectionChart"></canvas>
      </div>
    </div>
  </div>

  <!-- Initialize Leaflet -->
  <script src="js/analysis.js"></script>
</body>
</html>
